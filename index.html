<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </div>
            <div>
                <h1>Mein Dashboard</h1>
                <div class="header-info">
                    <span>
                        <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span id="current-date"></span>
                    </span>
                    <span>
                        <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span id="current-time"></span>
                    </span>
                    <span>
                        <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <span id="task-stats">0/0</span> Aufgaben
                    </span>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button id="add-task-btn" class="primary-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Neue Aufgabe
            </button>
        </div>
    </header>

    <div class="main-container">
        <div class="board">
            <div class="column" id="todo" data-status="todo">
                <div class="column-header">
                    <div class="column-title">
                        <div class="column-indicator"></div>
                        <h2>Zu erledigen</h2>
                    </div>
                    <span class="task-count" id="todo-count">0</span>
                </div>
                <div class="task-list"></div>
            </div>

            <div class="column" id="in-progress" data-status="in-progress">
                <div class="column-header">
                    <div class="column-title">
                        <div class="column-indicator"></div>
                        <h2>In Bearbeitung</h2>
                    </div>
                    <span class="task-count" id="progress-count">0</span>
                </div>
                <div class="task-list"></div>
            </div>

            <div class="column" id="done" data-status="done">
                <div class="column-header">
                    <div class="column-title">
                        <div class="column-indicator"></div>
                        <h2>Erledigt</h2>
                    </div>
                    <span class="task-count" id="done-count">0</span>
                </div>
                <div class="task-list"></div>
            </div>
        </div>

        <!-- Zwischenablage Panel -->
        <aside class="clipboard-panel">
            <div class="clipboard-header">
                <div class="clipboard-title">
                    <div class="clipboard-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                            </path>
                        </svg>
                    </div>
                    <h3>Zwischenablage</h3>
                </div>
            </div>
            <div class="clipboard-input-area">
                <textarea class="clipboard-input" id="clipboard-input"
                    placeholder="Text hier einfügen oder tippen...&#10;Strg+V zum schnellen Einfügen&#10;Bilder per Drag & Drop"></textarea>
                <div class="clipboard-buttons">
                    <button class="clipboard-btn" id="add-clipboard-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="17" x2="12" y2="3"></line>
                            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                        </svg>
                        Text speichern
                    </button>
                    <button class="clipboard-btn image-btn" id="image-upload-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        Bild
                    </button>
                </div>
                <input type="file" id="image-input" accept="image/*" style="display: none;">
            </div>
            <div class="clipboard-items" id="clipboard-items"></div>
        </aside>
    </div>

    <!-- Modal für Aufgaben -->
    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </span>
            <h2 id="modal-title">Neue Aufgabe</h2>

            <div class="form-group">
                <label class="form-label">Beschreibung</label>
                <textarea id="task-input" placeholder="Was muss erledigt werden?"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Priorität</label>
                <div class="priority-selector">
                    <div class="priority-option low" data-priority="low">Niedrig</div>
                    <div class="priority-option medium selected" data-priority="medium">Mittel</div>
                    <div class="priority-option high" data-priority="high">Hoch</div>
                </div>
            </div>

            <div class="modal-actions">
                <button id="delete-task-btn" class="danger-btn hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    Löschen
                </button>
                <button id="save-task-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Speichern
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Benachrichtigung -->
    <div class="toast" id="toast">
        <span class="toast-icon"></span>
        <span class="toast-message"></span>
    </div>

    <script src="script.js"></script>
</body>

</html>
